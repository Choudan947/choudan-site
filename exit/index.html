<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退出</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    background: radial-gradient(circle at 50% 30%, #1b3b6f 0%, #0b1a33 55%, #050b18 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #eaf2ff; text-align: center;
    padding: 24px; overflow: hidden; user-select: none;
  }
  h1 {
    font-size: clamp(30px, 6vw, 64px);
    font-weight: 800; letter-spacing: 8px;
    background: linear-gradient(90deg, #7fd0ff, #ffffff, #7fd0ff);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(120, 200, 255, .35);
  }
  .sub { font-size: 14px; letter-spacing: 3px; color: #7f9ac0; }
  #btn {
    margin-top: 6px;
    padding: 16px 64px;
    font-size: 20px; letter-spacing: 4px;
    color: #06121f; font-weight: 700;
    border: none; border-radius: 999px;
    background: linear-gradient(180deg, #ffffff, #a9dcff);
    box-shadow: 0 0 30px rgba(127, 208, 255, .55), inset 0 -3px 0 rgba(0,0,0,.08);
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
  }
  #btn:hover { transform: translateY(-2px); box-shadow: 0 0 44px rgba(127,208,255,.8); }
  #btn:active { transform: translateY(1px) scale(.98); }
  #bar-wrap {
    width: min(420px, 78vw); height: 10px; border-radius: 99px;
    background: rgba(255,255,255,.08); overflow: hidden;
    opacity: 0; transition: opacity .3s;
  }
  #bar-wrap.show { opacity: 1; }
  #bar {
    height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, #7fd0ff, #ffffff);
    box-shadow: 0 0 18px rgba(127,208,255,.8);
    transition: width .18s linear;
  }
  #tip { font-size: 13px; color: #6f8bad; letter-spacing: 2px; min-height: 18px; }
  .done h1 { opacity: .25; }
</style>
</head>
<body>
  <h1>退 出</h1>
  <div class="sub">本页唯一功能：退出</div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <button id="btn">退出</button>
  <div id="tip"></div>

<script>
(function () {
  var TARGET = "https://ys.mihoyo.com/";
  var btn = document.getElementById('btn');
  var bar = document.getElementById('bar');
  var wrap = document.getElementById('bar-wrap');
  var tip = document.getElementById('tip');
  var running = false;

  btn.addEventListener('click', function () {
    if (running) return;
    running = true;
    btn.disabled = true;
    btn.textContent = '正在退出';
    wrap.classList.add('show');
    tip.textContent = '正在关闭所有窗口…';

    var p = 0;
    var timer = setInterval(function () {
      p += Math.random() * 13 + 5;
      if (p >= 100) {
        p = 100;
        clearInterval(timer);
        bar.style.width = '100%';
        tip.textContent = '已退出，正在跳转…';
        document.body.classList.add('done');
        setTimeout(function () {
          window.location.href = TARGET;
        }, 700);
      } else {
        bar.style.width = p.toFixed(0) + '%';
        if (p > 60) tip.textContent = '正在清理缓存…';
      }
    }, 120);
  });
})();
</script>
</body>
</html>
